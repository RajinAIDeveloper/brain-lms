{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Brain Gym{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'#172033',mint:'#b7f3d5',lavender:'#ddd7ff'}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'DM Sans',sans-serif;background:#f7f8fc;color:#172033}.display{font-family:'Space Grotesk',sans-serif}.card{background:#fff;border:1px solid #e8eaf2;border-radius:24px;box-shadow:0 12px 40px rgba(31,41,70,.06)}</style>
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen">
{% block body %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>if(window.gsap&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){gsap.from('.animate-in',{opacity:0,y:18,duration:.65,stagger:.08,ease:'power2.out'});}</script>
{% block scripts %}{% endblock %}
</body>
</html>
