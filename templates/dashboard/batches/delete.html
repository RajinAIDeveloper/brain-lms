{% extends 'dashboard/base.html' %}
{% block title %}Delete class · Brain Gym{% endblock %}
{% block dashboard_content %}<div class="max-w-xl mt-16"><div class="card animate-in p-8"><div class="w-12 h-12 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center text-xl">!</div><h2 class="display text-3xl font-bold mt-6">Delete {{ batch.name }}?</h2><p class="text-slate-500 mt-3">This deletes the class and its enrollment records. Student accounts will not be deleted.</p><form method="post" class="flex gap-3 mt-8">{% csrf_token %}<a href="{% url 'accounts:batch_detail' batch.pk %}" class="rounded-xl border border-slate-200 px-5 py-3 text-sm font-semibold">Cancel</a><button class="rounded-xl bg-red-600 text-white px-5 py-3 text-sm font-semibold">Delete class</button></form></div></div>{% endblock %}
