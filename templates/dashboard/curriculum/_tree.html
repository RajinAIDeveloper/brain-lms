<ul class="space-y-3 {% if branches.0.node.parent_id %}ml-6 border-l border-slate-200 pl-5{% endif %}">{% for branch in branches %}<li><div class="flex items-center justify-between gap-3 rounded-xl bg-slate-50 px-4 py-3"><div><span class="text-[10px] uppercase tracking-wider font-bold text-indigo-600">{{ branch.node.get_node_type_display }}</span><a href="{% url 'accounts:curriculum_node_detail' branch.node.pk %}" class="block font-semibold text-ink hover:text-indigo-600">{{ branch.node.title }}</a></div><a href="{% url 'accounts:curriculum_node_create' %}?level={{ branch.node.level_id }}&parent={{ branch.node.pk }}" class="text-xs font-semibold text-indigo-600">Add child +</a></div>{% if branch.children %}{% include 'dashboard/curriculum/_tree.html' with branches=branch.children %}{% endif %}</li>{% endfor %}</ul>
