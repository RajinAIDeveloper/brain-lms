{% extends 'dashboard/base.html' %}
{% block title %}Delete level · Brain Gym{% endblock %}
{% block dashboard_content %}<div class="max-w-xl mt-16"><div class="card animate-in p-8"><div class="w-12 h-12 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center text-xl">!</div><h2 class="display text-3xl font-bold mt-6">Delete level {{ level.code }}?</h2><p class="text-slate-500 mt-3">This level can only be deleted when it has no classes or students assigned to it.</p><form method="post" class="flex gap-3 mt-8">{% csrf_token %}<a href="{% url 'accounts:level_detail' level.pk %}" class="rounded-xl border border-slate-200 px-5 py-3 text-sm font-semibold">Cancel</a><button class="rounded-xl bg-red-600 text-white px-5 py-3 text-sm font-semibold">Delete level</button></form></div></div>{% endblock %}
