{% extends 'base.html' %}{% block title %}Reset password · Brain Gym{% endblock %}{% block body %}<main class="min-h-screen flex items-center justify-center p-6"><div class="card p-8 max-w-md w-full"><a href="{% url 'login' %}" class="text-indigo-600 text-sm">← Back to sign in</a><h1 class="display text-3xl font-bold mt-8">Reset your password</h1><p class="text-slate-500 mt-2">Enter your account email and we’ll send reset instructions.</p><form method="post" class="mt-7">{% csrf_token %}{{ form.email }}<button class="mt-4 w-full rounded-xl bg-ink text-white py-3 font-semibold">Send instructions</button></form></div></main><script>document.querySelectorAll('input').forEach(i=>i.className='w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-indigo-500')</script>{% endblock %}
