{% extends 'base.html' %}{% block body %}<main class="min-h-screen flex items-center justify-center p-6"><div class="card p-8 max-w-md w-full"><h1 class="display text-3xl font-bold">Choose a new password</h1>{% if validlink %}<form method="post" class="mt-7 space-y-4">{% csrf_token %}{{ form.as_p }}<button class="w-full rounded-xl bg-ink text-white py-3 font-semibold">Save password</button></form>{% else %}<p class="text-red-600 mt-4">This reset link is invalid or has expired.</p>{% endif %}</div></main>{% endblock %}
